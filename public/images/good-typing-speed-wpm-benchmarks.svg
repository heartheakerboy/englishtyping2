<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Grid Pattern Subdued -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="160" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="980" cy="380" r="180" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Top Badge -->
  <rect x="70" y="60" width="220" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="92" cy="79" r="6" fill="#38bdf8" />
  <text x="110" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">ENGLISHTYPINGTEST.ORG</text>

  <!-- Category Tag -->
  <rect x="310" y="60" width="130" height="38" rx="19" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
  <text x="375" y="84" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">GUIDE &amp; BENCHMARKS</text>

  <!-- Main Headline -->
  <text x="70" y="170" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    What Is a Good Typing Speed?
  </text>
  <text x="70" y="225" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="700">
    WPM Benchmarks, Job Standards &amp; Improvement Guide
  </text>

  <text x="70" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Standard 5-keystroke measurement • SSC &amp; Live Chat criteria • 15-minute daily training
  </text>

  <!-- Benchmark Cards Row -->
  <g transform="translate(70, 320)">
    <!-- Card 1: Beginner -->
    <rect x="0" y="0" width="195" height="230" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="35" cy="38" r="10" fill="#64748b" opacity="0.3" />
    <text x="35" y="42" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
    <text x="56" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="700">Beginner</text>
    <text x="24" y="95" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="800">20-30</text>
    <text x="120" y="95" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="600">WPM</text>
    <text x="24" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">Casual / Hunt &amp; Peck</text>
    <line x1="24" y1="150" x2="171" y2="150" stroke="#334155" stroke-width="1" />
    <text x="24" y="180" fill="#64748b" font-family="sans-serif" font-size="12">Focus on posture &amp;</text>
    <text x="24" y="200" fill="#64748b" font-family="sans-serif" font-size="12">home row habits</text>

    <!-- Card 2: Average -->
    <rect x="215" y="0" width="195" height="230" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="250" cy="38" r="10" fill="#0284c7" opacity="0.3" />
    <text x="250" y="42" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">2</text>
    <text x="271" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="700">Average</text>
    <text x="239" y="95" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="800">35-45</text>
    <text x="335" y="95" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="600">WPM</text>
    <text x="239" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">Typical Typist</text>
    <line x1="239" y1="150" x2="386" y2="150" stroke="#334155" stroke-width="1" />
    <text x="239" y="180" fill="#64748b" font-family="sans-serif" font-size="12">Meets basic daily</text>
    <text x="239" y="200" fill="#64748b" font-family="sans-serif" font-size="12">office email needs</text>

    <!-- Card 3: Good (Highlighted) -->
    <rect x="430" y="-12" width="205" height="252" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="2.5" />
    <rect x="446" y="2" width="90" height="22" rx="11" fill="#6366f1" />
    <text x="491" y="17" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">SWEET SPOT</text>
    <text x="454" y="52" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="800">Good / Fluent</text>
    <text x="454" y="105" fill="#818cf8" font-family="sans-serif" font-size="38" font-weight="900">50-65</text>
    <text x="565" y="105" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600">WPM</text>
    <text x="454" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">Professional Speed</text>
    <line x1="454" y1="160" x2="615" y2="160" stroke="#4338ca" stroke-width="1" />
    <text x="454" y="190" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="500">Qualifies for live chat,</text>
    <text x="454" y="210" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="500">SSC CGL, admin roles</text>

    <!-- Card 4: Fast -->
    <rect x="655" y="0" width="195" height="230" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="690" cy="38" r="10" fill="#10b981" opacity="0.3" />
    <text x="690" y="42" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">4</text>
    <text x="711" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="700">Fast</text>
    <text x="679" y="95" fill="#34d399" font-family="sans-serif" font-size="32" font-weight="800">70-85</text>
    <text x="775" y="95" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="600">WPM</text>
    <text x="679" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">Power Typist</text>
    <line x1="679" y1="150" x2="826" y2="150" stroke="#334155" stroke-width="1" />
    <text x="679" y="180" fill="#64748b" font-family="sans-serif" font-size="12">Programmers, editors,</text>
    <text x="679" y="200" fill="#64748b" font-family="sans-serif" font-size="12">rapid data operators</text>

    <!-- Card 5: Expert -->
    <rect x="870" y="0" width="190" height="230" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="905" cy="38" r="10" fill="#f59e0b" opacity="0.3" />
    <text x="905" y="42" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">5</text>
    <text x="926" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="700">Expert</text>
    <text x="894" y="95" fill="#fbbf24" font-family="sans-serif" font-size="32" font-weight="800">90+</text>
    <text x="965" y="95" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="600">WPM</text>
    <text x="894" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">Competitive</text>
    <line x1="894" y1="150" x2="1036" y2="150" stroke="#334155" stroke-width="1" />
    <text x="894" y="180" fill="#64748b" font-family="sans-serif" font-size="12">Stenographers, speed</text>
    <text x="894" y="200" fill="#64748b" font-family="sans-serif" font-size="12">racers, transcriptionists</text>
  </g>
</svg>
